<hlm-drawer>
  <div class="flex min-h-dvh flex-col bg-background text-foreground">
    <header
      class="sticky top-0 z-10 flex h-16 items-center gap-3 border-b border-border bg-background/95 px-4 backdrop-blur sm:px-6"
    >
      <button
        hlmBtn
        variant="ghost"
        size="icon"
        hlmDrawerTrigger
        direction="left"
        type="button"
        aria-label="Toggle navigation"
      >
        <span aria-hidden="true">☰</span>
      </button>
      <span class="text-lg font-semibold tracking-tight">{{ title() }}</span>
      <span class="flex-1"></span>
      <label class="flex items-center gap-2 text-sm text-muted-foreground">
        <span>{{ darkMode() ? 'Dark' : 'Light' }}</span>
        <hlm-switch
          [checked]="darkMode()"
          (checkedChange)="darkMode.set($event)"
          aria-label="Toggle dark mode"
        />
      </label>
    </header>

    <main class="flex-1 overflow-auto px-4 py-8 sm:px-6 lg:px-8">
      <div class="mx-auto max-w-5xl">
        <router-outlet />
      </div>
    </main>
  </div>

  <div hlmDrawerPortal>
    <hlm-drawer-content>
      <hlm-drawer-header>
        <div hlmDrawerTitle>Issue Tracker</div>
      </hlm-drawer-header>
      <nav class="flex flex-col gap-2 px-4 pb-6" aria-label="Primary navigation">
        <a
          hlmBtn
          variant="ghost"
          routerLink="/issues"
          routerLinkActive="bg-accent text-accent-foreground"
          [routerLinkActiveOptions]="{ exact: true }"
          class="justify-start"
        >
          Issues
        </a>
        <a
          hlmBtn
          variant="ghost"
          routerLink="/issues/new"
          routerLinkActive="bg-accent text-accent-foreground"
          class="justify-start"
        >
          New issue
        </a>
      </nav>
    </hlm-drawer-content>
  </div>
</hlm-drawer>
