<mat-sidenav-container class="shell">
  <mat-sidenav #snav mode="over" fixedInViewport="true" fixedTopGap="0">
    <mat-toolbar class="side-toolbar">
      <span class="brand">Issue Tracker</span>
    </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/issues" routerLinkActive="active-link">
        <mat-icon matListItemIcon>bug_report</mat-icon>
        <span matListItemTitle>Issues</span>
      </a>
      <a mat-list-item routerLink="/issues/new" routerLinkActive="active-link">
        <mat-icon matListItemIcon>add_circle_outline</mat-icon>
        <span matListItemTitle>New Issue</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="topbar">
      <button mat-icon-button (click)="snav.toggle()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-title">{{ title() }}</span>
      <span class="spacer"></span>

      <mat-slide-toggle
        class="theme-toggle"
        [checked]="darkMode()"
        (change)="toggleTheme($event)"
        color="primary"
        aria-label="Toggle dark mode"
      >
        {{ darkMode() ? 'Dark' : 'Light' }}
      </mat-slide-toggle>
    </mat-toolbar>

    <main class="main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
