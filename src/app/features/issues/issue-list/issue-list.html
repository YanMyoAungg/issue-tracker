<section class="grid gap-6" aria-label="Issue list">
  <header class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="mb-1 text-xs font-bold uppercase tracking-widest text-primary">Overview</p>
      <h2 class="m-0 text-3xl font-semibold tracking-tight">Issues</h2>
    </div>

    <a pButton routerLink="/issues/new">
      <i class="pi pi-plus mr-2"></i>
      New issue
    </a>
  </header>

  @if (issues().length === 0) {
    <div class="grid justify-items-start gap-4 rounded-2xl border border-dashed border-surface-300 bg-surface-0 p-8 dark:border-surface-700 dark:bg-surface-900">
      <p class="m-0 text-surface-600 dark:text-surface-300">No issues yet.</p>
      <a pButton routerLink="/issues/new">Create the first issue</a>
    </div>
  } @else {
    <ul class="m-0 grid list-none gap-4 p-0">
      @for (issue of issues(); track issue.id) {
        <li class="flex flex-col justify-between gap-5 rounded-2xl border border-surface-200 bg-surface-0 p-5 shadow-sm dark:border-surface-800 dark:bg-surface-900 sm:flex-row">
          <div class="grid min-w-0 flex-1 gap-3">
            <div class="flex flex-wrap items-center gap-3">
              <h3 class="m-0 text-lg font-semibold">{{ issue.title }}</h3>
              <p-tag [value]="issue.status" severity="info" />
            </div>

            <p class="m-0 leading-6 text-surface-600 dark:text-surface-300">{{ issue.description }}</p>

            <div class="flex flex-wrap items-center gap-3">
              <p-tag [value]="issue.priority" severity="secondary" />
              <span class="text-sm text-surface-500">{{ issue.createdAt | date: 'mediumDate' }}</span>
            </div>
          </div>

          <div class="flex shrink-0 items-center gap-2">
            <a pButton severity="secondary" [outlined]="true" [routerLink]="['/issues', issue.id]">Edit</a>
            <button pButton type="button" severity="danger" [outlined]="true" (click)="deleteIssue(issue.id)">
              Delete
            </button>
          </div>
        </li>
      }
    </ul>
  }
</section>
