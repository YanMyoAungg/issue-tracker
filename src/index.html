<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IssueTracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No-flash theme: sets the dark-mode class on the root before first paint,
      using the saved preference, or the OS preference when nothing is saved.
      This prevents a flash of light theme before Angular hydrates.
      Must match the `.dark` selector used by the Spartan theme.
    -->
    <script>
      (function () {
        try {
          var preferred = localStorage.getItem('theme');
          var dark =
            preferred === 'dark' ||
            (preferred !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
